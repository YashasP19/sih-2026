<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 38" width="40" height="38" fill="none">
  <defs>
    <!-- Terracotta / Burnt Orange Gradient -->
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2623B" />
      <stop offset="100%" stop-color="#C04322" />
    </linearGradient>

    <!-- Warm Highlight Gradient -->
    <linearGradient id="warmHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#7B2C15" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Rounded Container (Squircle) -->
  <rect x="2" y="1" width="36" height="35" rx="9" fill="url(#terracottaGrad)" filter="url(#subtleShadow)" />
  
  <!-- Subtle Top Sheen -->
  <rect x="3" y="2" width="34" height="15" rx="8" fill="url(#warmHighlight)" />

  <!-- Lens Viewfinder Aperture Ring -->
  <circle cx="20" cy="18.5" r="10.5" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2" />
  <circle cx="20" cy="18.5" r="8" stroke="#FFFFFF" stroke-width="1.6" stroke-dasharray="10 3 4 3" stroke-linecap="round" />

  <!-- Focus Brackets (Viewfinder Accent - Muted Gold/Coral) -->
  <path d="M 28 11.5 L 30 11.5 L 30 13.5" stroke="#FFD79E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 12 25.5 L 10 25.5 L 10 23.5" stroke="#FFD79E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Civic Landmark Motif (Urban Architecture in Lens) -->
  <!-- Pediment / Roof Triangle -->
  <path d="M 20 13.2 L 15.2 17 L 24.8 17 Z" fill="#FFFFFF" />

  <!-- Civic Pillars -->
  <rect x="15.8" y="17.6" width="1.6" height="4.4" rx="0.5" fill="#FFFFFF" />
  <rect x="19.2" y="17.6" width="1.6" height="4.4" rx="0.5" fill="#FFFFFF" />
  <rect x="22.6" y="17.6" width="1.6" height="4.4" rx="0.5" fill="#FFFFFF" />

  <!-- Base Plinth -->
  <rect x="14.5" y="22.4" width="11" height="1.3" rx="0.6" fill="#FFF7F2" />

  <!-- Focus Spark / Beacon (Gold) -->
  <circle cx="20" cy="11.8" r="1.1" fill="#FFC966" />
</svg>
